# Render blueprint for the backend API. The frontend is deployed on Vercel (see README, "Deploy").
services:
  - type: web
    name: upi-safety-check-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Free plan (512 MB). The app uses about 210 MB at start and 270 MB once every page has been opened; each uploaded
    # dataset held in memory adds about 30 MB, so uploads are capped at 4 here. Free services sleep after 15 minutes without visits.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # lets any *.vercel.app address call the API; set CORS_ORIGINS too if you add a custom domain
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      # keep memory under the free plan's 512 MB (each held upload is about 30 MB)
      - key: MAX_UPLOADS
        value: "4"
