# Render blueprint for the backend API. The frontend is deployed on Vercel (see README, "Deploy").
services:
  - type: web
    name: upi-safety-check-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Free plan (512 MB, 0.1 CPU). Measured in Docker at those limits: about 150 MB idle, 240 MB once every page has been
    # opened, 310 MB with 4 full-size uploads held, hence the cap of 4 below. Free services sleep after 15 minutes without visits.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # lets any *.vercel.app address call the API; set CORS_ORIGINS too if you add a custom domain
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      # keep memory under the free plan's 512 MB (each held upload is about 30 MB)
      - key: MAX_UPLOADS
        value: "4"
